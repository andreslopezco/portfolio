<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1a0d"/>
      <stop offset="100%" stop-color="#1a2e1a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Canvas background -->
  <rect x="30" y="20" width="740" height="410" rx="12" fill="#111a11" stroke="#2a4a2a" stroke-width="1"/>
  <!-- Nodes -->
  <rect x="60" y="60" width="160" height="50" rx="25" fill="#1a3a1a" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="100" y="90" font-family="monospace" font-size="13" fill="#2ecc71" font-weight="bold">Webhook</text>
  <!-- Arrow 1 → 2 -->
  <line x1="220" y1="85" x2="290" y2="85" stroke="#555" stroke-width="1.5"/>
