  <text x="333" y="90" font-family="monospace" font-size="13" fill="#f5c518" font-weight="bold">Filtrar</text>
  <!-- Arrow 2 → 3 -->
  <line x1="460" y1="85" x2="530" y2="85" stroke="#555" stroke-width="1.5"/>
  <circle cx="530" cy="85" r="4" fill="#2ecc71"/>
  <rect x="540" y="60" width="180" height="50" rx="25" fill="#1a3a1a" stroke="#3498db" stroke-width="1.5"/>
  <text x="570" y="90" font-family="monospace" font-size="13" fill="#3498db" font-weight="bold">CRM Sync</text>
  <!-- Branch down -->
  <line x1="370" y1="110" x2="370" y2="160" stroke="#555" stroke-width="1.5"/>
  <circle cx="370" cy="160" r="4" fill="#f5c518"/>
  <!-- Node 4 -->
  <rect x="60" y="170" width="180" height="50" rx="25" fill="#1a3a1a" stroke="#e94560" stroke-width="1.5"/>
  <text x="100" y="200" font-family="monospace" font-size="13" fill="#e94560" font-weight="bold">Email Marketing</text>
  <!-- Arrow 4 → 5 -->
  <line x1="240" y1="195" x2="310" y2="195" stroke="#555" stroke-width="1.5"/>
  <circle cx="310" cy="195" r="4" fill="#2ecc71"/>
  <!-- Node 5 -->
  <rect x="320" y="170" width="180" height="50" rx="25" fill="#1a3a1a" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="355" y="200" font-family="monospace" font-size="13" fill="#9b59b6" font-weight="bold">Facturaci&oacute;n</text>
  <!-- Arrow 5 → 6 -->
  <line x1="500" y1="195" x2="570" y2="195" stroke="#555" stroke-width="1.5"/>
  <circle cx="570" cy="195" r="4" fill="#2ecc71"/>
  <!-- Node 6 -->
  <rect x="580" y="170" width="160" height="50" rx="25" fill="#1a3a1a" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="610" y="200" font-family="monospace" font-size="13" fill="#2ecc71" font-weight="bold">Notificar</text>
  <!-- Status bar -->
  <rect x="60" y="270" width="680" height="130" rx="8" fill="#0d1a0d" stroke="#2a4a2a" stroke-width="1"/>
  <text x="80" y="295" font-family="monospace" font-size="11" fill="#667799">Workflow: Sincronizaci&oacute;n CRM → Email → Facturaci&oacute;n</text>
  <text x="80" y="318" font-family="monospace" font-size="11" fill="#2ecc71">&bull; Ejecutado: 1,247 veces</text>
  <text x="80" y="338" font-family="monospace" font-size="11" fill="#f5c518">&bull; &Uacute;ltima ejecuci&oacute;n: 2 min atr&aacute;s (exitosa)</text>
  <text x="80" y="358" font-family="monospace" font-size="11" fill="#667799">&bull; Tasa de &eacute;xito: 99.3%</text>
  <text x="80" y="378" font-family="monospace" font-size="11" fill="#e94560">&bull; Errores: 3 (0.2%)</text>
</svg>