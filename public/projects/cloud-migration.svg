      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a3e"/>
    </linearGradient>
    <linearGradient id="cloud1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7D49EC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3498db" stop-opacity="0.1"/>
