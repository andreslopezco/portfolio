  <rect x="265" y="268" width="110" height="15" rx="2" fill="#2a1a5e"/>
  <rect x="265" y="291" width="80" height="15" rx="2" fill="#1a3a1a"/>
  <rect x="265" y="314" width="110" height="15" rx="2" fill="#1a3a1a"/>
  <!-- Middle server rack -->
  <rect x="420" y="200" width="140" height="180" rx="6" fill="#111a2e" stroke="#2a4a6e" stroke-width="1.5"/>
