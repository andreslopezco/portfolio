<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="msg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7D49EC"/>
      <stop offset="100%" stop-color="#5a2db0"/>
    </linearGradient>
    <linearGradient id="msg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#2a1a4a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Terminal window -->
  <rect x="30" y="20" width="740" height="410" rx="12" fill="#0d0d1f" stroke="#2a2a4e" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="30" y="20" width="740" height="36" rx="12" fill="#1a1a3a"/>
  <rect x="30" y="44" width="740" height="12" fill="#1a1a3a"/>
  <circle cx="55" cy="38" r="5" fill="#e94560"/>
  <circle cx="72" cy="38" r="5" fill="#f5c518"/>
  <circle cx="89" cy="38" r="5" fill="#2ecc71"/>
  <text x="115" y="43" font-family="monospace" font-size="13" fill="#667799">hermes-agent --session interactive</text>
  <!-- Messages -->
  <rect x="50" y="70" width="300" height="40" rx="8" fill="#1e1e3a" opacity="0.8"/>
  <text x="65" y="90" font-family="monospace" font-size="12" fill="#8888aa">$ desplegar contenedor postgres</text>
  <rect x="200" y="120" width="560" height="55" rx="8" fill="url(#msg1)" opacity="0.9"/>
  <text x="215" y="143" font-family="monospace" font-size="12" fill="#ffffff">Creando contenedor PostgreSQL 16...</text>
  <text x="215" y="162" font-family="monospace" font-size="12" fill="#c0a0ff">Puerto: 5432 | Volumen: pg-data</text>
  <rect x="50" y="190" width="280" height="40" rx="8" fill="#1e1e3a" opacity="0.8"/>
  <text x="65" y="210" font-family="monospace" font-size="12" fill="#8888aa">$ configurar backup autom&aacute;tico</text>
  <rect x="200" y="240" width="540" height="55" rx="8" fill="url(#msg1)" opacity="0.9"/>
  <text x="215" y="263" font-family="monospace" font-size="12" fill="#ffffff">Backup diario configurado a las 03:00</text>
  <text x="215" y="282" font-family="monospace" font-size="12" fill="#c0a0ff">Retenci&oacute;n: 7 d&iacute;as | Destino: NAS-01</text>
  <rect x="50" y="310" width="260" height="40" rx="8" fill="#1e1e3a" opacity="0.8"/>
  <text x="65" y="330" font-family="monospace" font-size="12" fill="#8888aa">$ estado del sistema</text>
  <rect x="200" y="360" width="540" height="50" rx="8" fill="url(#msg1)" opacity="0.9"/>
  <text x="215" y="383" font-family="monospace" font-size="12" fill="#ffffff">CPU: 34% | RAM: 2.1/8GB | Disco: 45%</text>
  <text x="215" y="400" font-family="monospace" font-size="12" fill="#c0a0ff">Contenedores: 12 activos, 3 detenidos</text>
  <!-- Glow effect -->
  <ellipse cx="400" cy="225" rx="350" ry="200" fill="#7D49EC" opacity="0.03"/>
</svg>